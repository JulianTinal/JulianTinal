name: Generate contribution arcade

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Bomberman contribution graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: JulianTinal
          games: "bomberman"
          hide_month_labels: "false"

      - name: Publish generated SVGs
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
